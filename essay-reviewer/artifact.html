<title>Red Pen Essay Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Schibsted+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Layout: two-column desk — manuscript on the left, marked-up review on the right; stacks on phones. */
  :root {
    --paper: #f3f4f1; --sheet: #ffffff; --ink: #1c2230; --ink-soft: #5d6575;
    --rule: #d9dcd6; --accent: #24427a; --accent-ink: #ffffff; --redpen: #c2362b;
    --redpen-wash: #fbe9e6; --good: #2d6a46; --warn: #a86a12;
    --display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #13161c; --sheet: #1b1f27; --ink: #e6e8ec; --ink-soft: #9aa1ae;
      --rule: #2e3440; --accent: #8fb0ea; --accent-ink: #0f1a2e; --redpen: #f07b6f;
      --redpen-wash: #3a1f1d; --good: #7cc79a; --warn: #e2ad5a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #13161c; --sheet: #1b1f27; --ink: #e6e8ec; --ink-soft: #9aa1ae;
    --rule: #2e3440; --accent: #8fb0ea; --accent-ink: #0f1a2e; --redpen: #f07b6f;
    --redpen-wash: #3a1f1d; --good: #7cc79a; --warn: #e2ad5a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--display); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 16px 56px; display: grid; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
  h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  h1 span { color: var(--redpen); }
  header p { margin: 0; color: var(--ink-soft); max-width: 60ch; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .desk { grid-template-columns: minmax(0, 1fr); } }
  .sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 20px; display: grid; gap: 14px; min-width: 0; }
  .eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
  .field { display: grid; gap: 5px; min-width: 0; }
  label { font-weight: 500; font-size: 0.9rem; }
  .opt { color: var(--ink-soft); font-weight: 400; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 4px; padding: 9px 10px;
  }
  textarea#essay { font: 16px/1.7 var(--serif); min-height: 360px; resize: vertical; padding: 14px 16px; }
  textarea#prompt { min-height: 64px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .meter { display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); font-size: 0.8rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .meter .over { color: var(--redpen); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button { font: inherit; font-weight: 700; border-radius: 4px; padding: 10px 18px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--accent); color: var(--accent-ink); }
  .primary:disabled { opacity: 0.55; cursor: progress; }
  .ghost { background: transparent; color: var(--ink); border-color: var(--rule); font-weight: 500; }
  .status { font-size: 0.88rem; color: var(--ink-soft); }
  .status.err { color: var(--redpen); }

  /* Report */
  .banner { font-size: 0.82rem; background: var(--paper); border: 1px dashed var(--rule); padding: 8px 10px; border-radius: 4px; color: var(--ink-soft); }
  .score { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .grade { font: 700 3.4rem/1 var(--display); color: var(--redpen); font-variant-numeric: tabular-nums; border: 3px solid var(--redpen); border-radius: 50%; width: 112px; height: 112px; display: grid; place-items: center; transform: rotate(-6deg); flex: none; }
  .grade small { display: block; font-size: 0.8rem; font-weight: 500; margin-top: -6px; text-align: center; }
  .verdict { font: 1.1rem/1.45 var(--serif); margin: 0; flex: 1 1 220px; min-width: 0; }
  .cats { display: grid; gap: 10px; }
  .cat { display: grid; grid-template-columns: minmax(0, 11rem) 1fr 2.6rem; gap: 4px 12px; align-items: center; }
  .cat .name { font-weight: 500; font-size: 0.9rem; }
  .bar { height: 8px; background: var(--paper); border-radius: 4px; overflow: hidden; border: 1px solid var(--rule); }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .cat .num { font-family: var(--mono); font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; }
  .cat .why { grid-column: 1 / -1; color: var(--ink-soft); font-size: 0.86rem; margin: -2px 0 2px; }
  @media (max-width: 480px) { .cat { grid-template-columns: 1fr 2.6rem; } .bar { grid-column: 1 / -1; grid-row: 2; } }
  h2 { margin: 6px 0 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--chip, var(--accent)); }
  h2.good { --chip: var(--good); } h2.fix { --chip: var(--redpen); } h2.fit { --chip: var(--warn); }
  ul, ol { margin: 0; padding-left: 1.2rem; display: grid; gap: 6px; }
  ol li strong { display: block; }
  .notes { display: grid; gap: 10px; }
  .note { border-left: 3px solid var(--redpen); padding: 4px 0 4px 12px; display: grid; gap: 3px; min-width: 0; }
  .note q { font: italic 0.98rem/1.5 var(--serif); text-decoration: underline wavy var(--redpen); text-underline-offset: 4px; text-decoration-thickness: 1px; quotes: "“" "”"; overflow-wrap: anywhere; }
  .note .issue { font-size: 0.88rem; color: var(--ink-soft); }
  .note .fixit { font-size: 0.9rem; background: var(--redpen-wash); border-radius: 3px; padding: 4px 8px; justify-self: start; overflow-wrap: anywhere; }
  .placeholder { color: var(--ink-soft); font: 1rem/1.6 var(--serif); }
  .thinking::after { content: "…"; animation: blink 1.2s steps(4) infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  @media (prefers-reduced-motion: reduce) { .thinking::after { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Red Pen <span>Essay Review</span></h1>
    <p>Paste a draft, add the prompt if you have one, and get a scored review with the fixes that matter most. Runs on your own Claude account.</p>
  </header>

  <div class="desk">
    <form class="sheet" id="form">
      <div class="eyebrow">Your draft</div>
      <div class="grid2">
        <div class="field">
          <label for="essayType">Essay type</label>
          <select id="essayType">
            <option>Personal statement</option>
            <option>Argumentative</option>
            <option>Literary analysis</option>
            <option>Research paper</option>
            <option>Narrative</option>
            <option>Scholarship essay</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="level">Level</label>
          <select id="level">
            <option>High school</option>
            <option selected>Undergraduate</option>
            <option>Graduate</option>
            <option>Professional</option>
          </select>
        </div>
        <div class="field">
          <label for="limit">Word limit <span class="opt">(optional)</span></label>
          <input id="limit" type="number" min="0" inputmode="numeric" placeholder="e.g. 650">
        </div>
        <div class="field">
          <label for="depth">Review depth</label>
          <select id="depth">
            <option value="quick">Quick skim</option>
            <option value="default" selected>Standard</option>
            <option value="complex">Thorough</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="prompt">Prompt or rubric <span class="opt">(optional)</span></label>
        <textarea id="prompt" placeholder="Paste the question, rubric or grading criteria"></textarea>
      </div>
      <div class="field">
        <label for="essay">Essay</label>
        <textarea id="essay" placeholder="Paste your essay here"></textarea>
        <div class="meter"><span id="words">0 words</span><span id="paras">0 paragraphs</span></div>
      </div>
      <div class="actions">
        <button class="primary" id="go" type="submit">Review essay</button>
        <button class="ghost" id="stop" type="button" hidden>Stop</button>
        <button class="ghost" id="clear" type="button">Clear</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </form>

    <section class="sheet" id="report" aria-live="polite"></section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const DRAFT_KEY = "red-pen-draft";

const EXAMPLE_ESSAY = `Ever since I was young, I have always been passionate about helping people. When I was fifteen my grandmother was diagnosed with diabetes and I spent many afternoons helping her check her blood sugar and cook meals that she could eat.

This experience taught me alot about responsibility. I learned that small habits, like writing down her readings in a notebook, could make a big difference. Sometimes she didn't want to do it and I had to be patient with her.

In high school I joined the Health Occupations club and volunteered at a free clinic on Saturdays. At the clinic I mostly checked people in, but I noticed how nervous many patients were and I started explaining the forms to them in Spanish.

I want to study nursing because I believe that everyone deserves to understand their own care. In conclusion, my grandmother and the clinic showed me that I want to spend my life helping others.`;

const EXAMPLE_REVIEW = {
  overall: 74,
  verdict: "A sincere draft with two strong, concrete scenes, held back by a generic opening and an ending that restates instead of reflecting.",
  categories: [
    { name: "Thesis & focus", score: 7, note: "The link between translation and patient understanding is the real thesis, but it only appears in the last paragraph." },
    { name: "Structure & flow", score: 7, note: "Clear chronology; paragraphs connect, though each ends abruptly." },
    { name: "Evidence & detail", score: 8, note: "The notebook of readings and explaining forms in Spanish are specific and memorable." },
    { name: "Style & voice", score: 6, note: "Stock phrases (“always been passionate”, “In conclusion”) flatten an otherwise personal voice." },
    { name: "Grammar & mechanics", score: 8, note: "Clean overall; one spelling error and a run-on in paragraph one." }
  ],
  strengths: [
    "Concrete, sensory details: the blood-sugar notebook and the Saturday check-in desk.",
    "Shows growth from caring for one person to noticing a pattern across many patients.",
    "The Spanish-language detail gives the essay a distinctive angle no other applicant will share."
  ],
  priorities: [
    { title: "Open on a scene, not a claim", detail: "Start with your grandmother refusing to log a reading, or a nervous patient at the clinic. Cut “Ever since I was young”." },
    { title: "Move the real thesis forward", detail: "Hint early that understanding one’s own care is what drives you, so the ending pays it off instead of introducing it." },
    { title: "Replace the summary ending", detail: "Drop “In conclusion”. End on what you will do as a nurse, tied back to a specific moment." },
    { title: "Show the patience, don’t name it", detail: "Give one line of what you actually said or did when she didn’t want to check her levels." }
  ],
  lineNotes: [
    { quote: "Ever since I was young, I have always been passionate about helping people.", issue: "A very common opener that tells the reader nothing specific about you.", suggestion: "Begin with the moment at your grandmother’s kitchen table." },
    { quote: "This experience taught me alot about responsibility.", issue: "Spelling: “alot”. Also abstract.", suggestion: "“a lot”, and name the specific responsibility you took on." },
    { quote: "I mostly checked people in", issue: "Undersells the most original part of the essay.", suggestion: "Describe one patient and what changed once the form made sense to them." }
  ],
  promptFit: null
};

function counts() {
  const text = $("essay").value.trim();
  const words = text ? text.split(/\s+/).length : 0;
  const paras = text ? text.split(/\n\s*\n/).filter((p) => p.trim()).length : 0;
  const limit = parseInt($("limit").value, 10);
  const w = $("words");
  w.textContent = limit > 0 ? `${words} / ${limit} words` : `${words} word${words === 1 ? "" : "s"}`;
  w.className = limit > 0 && words > limit ? "over" : "";
  $("paras").textContent = `${paras} paragraph${paras === 1 ? "" : "s"}`;
  return words;
}

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  Object.assign(n, props);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

function clampInt(v, lo, hi) {
  const n = Math.round(Number(v));
  return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : lo;
}

function renderReport(r, { example = false } = {}) {
  const box = $("report");
  box.replaceChildren();
  box.append(el("div", { className: "eyebrow", textContent: "Review" }));
  if (example) box.append(el("div", { className: "banner", textContent: "Example review of the sample essay. Paste your own draft and press Review essay to get yours." }));

  const overall = clampInt(r.overall, 0, 100);
  const grade = el("div", { className: "grade", ariaLabel: `${overall} out of 100` }, el("div", {}, String(overall), el("small", { textContent: "/ 100" })));
  box.append(el("div", { className: "score" }, grade, el("p", { className: "verdict", textContent: String(r.verdict || "") })));

  if (Array.isArray(r.categories) && r.categories.length) {
    const cats = el("div", { className: "cats" });
    for (const c of r.categories) {
      const s = clampInt(c.score, 0, 10);
      const bar = el("div", { className: "bar" }, el("i"));
      bar.firstChild.style.width = `${s * 10}%`;
      cats.append(el("div", { className: "cat" },
        el("span", { className: "name", textContent: String(c.name || "") }),
        bar,
        el("span", { className: "num", textContent: `${s}/10` }),
        c.note ? el("span", { className: "why", textContent: String(c.note) }) : null));
    }
    box.append(cats);
  }

  if (Array.isArray(r.priorities) && r.priorities.length) {
    box.append(el("h2", { className: "fix", textContent: "Fix these first" }));
    box.append(el("ol", {}, ...r.priorities.map((p) =>
      el("li", {}, el("strong", { textContent: String(p.title || "") }), String(p.detail || "")))));
  }

  if (Array.isArray(r.strengths) && r.strengths.length) {
    box.append(el("h2", { className: "good", textContent: "What’s working" }));
    box.append(el("ul", {}, ...r.strengths.map((s) => el("li", { textContent: String(s) }))));
  }

  if (Array.isArray(r.lineNotes) && r.lineNotes.length) {
    box.append(el("h2", { className: "fix", textContent: "Line notes" }));
    box.append(el("div", { className: "notes" }, ...r.lineNotes.map((n) =>
      el("div", { className: "note" },
        el("q", { textContent: String(n.quote || "") }),
        el("span", { className: "issue", textContent: String(n.issue || "") }),
        n.suggestion ? el("span", { className: "fixit", textContent: "Try: " + String(n.suggestion) }) : null))));
  }

  if (r.promptFit) {
    box.append(el("h2", { className: "fit", textContent: "Fit to the prompt" }));
    box.append(el("p", { style: "margin:0", textContent: String(r.promptFit) }));
  }
}

function showThinking(msg) {
  $("report").replaceChildren(
    el("div", { className: "eyebrow", textContent: "Review" }),
    el("p", { className: "placeholder thinking", textContent: msg }));
}

function setStatus(text, err = false) {
  $("status").textContent = text;
  $("status").className = err ? "status err" : "status";
}

const ERRORS = {
  not_granted: "Claude access wasn’t allowed for this page. Use the page’s permissions menu to allow it.",
  sampling_disabled: "Claude isn’t available on this account.",
  rate_limited: "You’ve hit a usage limit. Wait a bit, then try again.",
  session_expired: "Your session expired. Sign in again, then retry.",
  prompt_too_large: "That essay is too long to review in one go. Try a shorter section.",
  refused: "Claude declined to review this text.",
  invalid_json: "The review came back in an unreadable format. Press Review essay to try again.",
  empty_completion: "The review came back empty. Try again.",
};

function buildPrompt() {
  const limit = parseInt($("limit").value, 10);
  const promptText = $("prompt").value.trim();
  return `You are an experienced writing instructor reviewing a student's essay. Be honest, specific and encouraging. Quote short phrases from the essay exactly as written. Do not rewrite the essay; show the student how to improve it.

Essay type: ${$("essayType").value}
Level: ${$("level").value}
${limit > 0 ? `Word limit: ${limit} (the essay has ${counts()} words)` : ""}
${promptText ? `<assignment>\n${promptText}\n</assignment>` : "No assignment prompt was given."}

<essay>
${$("essay").value.trim()}
</essay>

Reply with only a JSON object in exactly this shape:
{"overall": 0-100 integer, "verdict": "one-sentence overall judgement",
 "categories": [{"name": "Thesis & focus"|"Structure & flow"|"Evidence & detail"|"Style & voice"|"Grammar & mechanics", "score": 0-10 integer, "note": "one sentence"}] (all five, in that order),
 "strengths": ["2-4 short bullets"],
 "priorities": [{"title": "short imperative", "detail": "one or two sentences"}] (3-5, most important first),
 "lineNotes": [{"quote": "exact phrase from the essay", "issue": "what's wrong", "suggestion": "how to fix it"}] (3-8),
 "promptFit": "two sentences on how well it answers the assignment, or null if none was given"}`;
}

let ctl = null;
let samplePromise = window.claude?.use ? window.claude.use("sample") : Promise.resolve(null);

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!$("essay").value.trim()) { setStatus("Paste an essay first.", true); return; }
  if (counts() < 40) { setStatus("Add a bit more text. Reviews work best on 40+ words.", true); return; }

  const sample = await samplePromise;
  if (!sample) { setStatus("Claude isn’t available in this view. Open the page on claude.ai while signed in.", true); return; }

  ctl = new AbortController();
  $("go").disabled = true;
  $("stop").hidden = false;
  setStatus("");
  showThinking("Reading your essay");

  try {
    const review = await sample.json(buildPrompt(), {
      modelTier: $("depth").value,
      signal: ctl.signal,
      onText: () => { $("report").querySelector(".placeholder").textContent = "Writing the review"; },
    });
    if (!review || typeof review !== "object") throw { code: "invalid_json" };
    renderReport(review);
    setStatus("Review ready.");
  } catch (err) {
    if (err?.code === "cancelled") { setStatus("Stopped."); renderReport(EXAMPLE_REVIEW, { example: true }); }
    else { setStatus(ERRORS[err?.code] || "Something went wrong reaching Claude. Try again.", true); renderReport(EXAMPLE_REVIEW, { example: true }); }
  } finally {
    $("go").disabled = false;
    $("stop").hidden = true;
    ctl = null;
  }
});

$("stop").addEventListener("click", () => ctl?.abort());
$("clear").addEventListener("click", () => { $("essay").value = ""; $("prompt").value = ""; counts(); saveDraft(); $("essay").focus(); });

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ essay: $("essay").value, prompt: $("prompt").value, limit: $("limit").value })); } catch {}
}
for (const id of ["essay", "prompt", "limit"]) $(id).addEventListener("input", () => { counts(); saveDraft(); });

let draft = null;
try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch {}
if (draft && draft.essay) {
  $("essay").value = draft.essay; $("prompt").value = draft.prompt || ""; $("limit").value = draft.limit || "";
} else {
  $("essay").value = EXAMPLE_ESSAY; $("limit").value = "650";
}
counts();
renderReport(EXAMPLE_REVIEW, { example: true });
</script>
