<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essay Reviewer</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a65;
    --border: #dcdad3; --accent: #2f5d50; --accent-text: #ffffff; --error: #a3322a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #201f1c; --text: #ecebe6; --muted: #a09e96;
      --border: #3a3934; --accent: #7fb8a4; --accent-text: #10201b; --error: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.lede { color: var(--muted); margin: 0 0 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  textarea { min-height: 280px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  .field { margin-bottom: 12px; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px;
    padding: 10px 18px; background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  #count { color: var(--muted); font-size: 0.9rem; }
  #status { color: var(--muted); font-size: 0.9rem; }
  #status.error { color: var(--error); }
  #output { white-space: pre-wrap; word-wrap: break-word; min-height: 3em; }
  #output:empty::before { content: "Your feedback will appear here."; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Essay Reviewer</h1>
  <p class="lede">Paste an essay and get structured feedback from Claude. Runs entirely in your browser with your own Anthropic API key.</p>

  <section class="panel">
    <div class="field">
      <label for="apiKey">Anthropic API key <span class="hint">— stored only in this browser if you tick "remember"</span></label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <label class="hint" style="margin-top:6px"><input id="remember" type="checkbox" style="width:auto"> Remember key on this device</label>
    </div>
    <div class="row">
      <div class="field">
        <label for="essayType">Essay type</label>
        <select id="essayType">
          <option>College application / personal statement</option>
          <option>Argumentative</option>
          <option>Analytical / literary analysis</option>
          <option>Research paper</option>
          <option>Narrative</option>
          <option>Scholarship essay</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label for="level">Writing level</label>
        <select id="level">
          <option>High school</option>
          <option selected>Undergraduate</option>
          <option>Graduate</option>
          <option>Professional</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label for="prompt">Assignment prompt or rubric <span class="hint">(optional)</span></label>
      <textarea id="prompt" style="min-height:80px" placeholder="Paste the question, word limit, or grading criteria"></textarea>
    </div>
    <div class="field">
      <label for="essay">Your essay</label>
      <textarea id="essay" placeholder="Paste your essay here"></textarea>
    </div>
    <div class="actions">
      <button id="review">Review essay</button>
      <button id="stop" class="secondary" hidden>Stop</button>
      <span id="count">0 words</span>
      <span id="status"></span>
    </div>
  </section>

  <section class="panel">
    <label>Feedback</label>
    <div id="output"></div>
  </section>
</main>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.65.0/+esm";

const $ = (id) => document.getElementById(id);
const KEY_STORE = "essay-reviewer-api-key";

const SYSTEM = `You are an experienced writing instructor reviewing a student's essay.
Give honest, specific, actionable feedback. Quote short phrases from the essay to anchor your points.
Do not rewrite the essay for the student; show them how to improve it themselves.

Structure your response in plain text with these sections:
OVERALL SCORE: a score out of 100 and a one-sentence verdict.
SCORES BY CATEGORY: Thesis & focus, Structure & flow, Evidence & support, Style & voice, Grammar & mechanics — each out of 10 with one line of justification.
STRENGTHS: 2–4 bullets.
TOP PRIORITIES TO FIX: the 3–5 changes that would most improve the essay, most important first.
LINE-LEVEL NOTES: specific sentences or phrases with a suggested fix.
FIT TO PROMPT: if a prompt or rubric was given, how well the essay answers it.`;

let controller = null;

try {
  const saved = localStorage.getItem(KEY_STORE);
  if (saved) { $("apiKey").value = saved; $("remember").checked = true; }
} catch {}

const updateCount = () => {
  const words = $("essay").value.trim().split(/\s+/).filter(Boolean).length;
  $("count").textContent = `${words} word${words === 1 ? "" : "s"}`;
};
$("essay").addEventListener("input", updateCount);

function setStatus(text, isError = false) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "";
}

$("stop").addEventListener("click", () => controller?.abort());

$("review").addEventListener("click", async () => {
  const apiKey = $("apiKey").value.trim();
  const essay = $("essay").value.trim();
  if (!apiKey) return setStatus("Enter your API key.", true);
  if (!essay) return setStatus("Paste an essay first.", true);

  try {
    if ($("remember").checked) localStorage.setItem(KEY_STORE, apiKey);
    else localStorage.removeItem(KEY_STORE);
  } catch {}

  const userText =
    `Essay type: ${$("essayType").value}\nWriting level: ${$("level").value}\n\n` +
    ($("prompt").value.trim() ? `<assignment>\n${$("prompt").value.trim()}\n</assignment>\n\n` : "") +
    `<essay>\n${essay}\n</essay>`;

  const client = new Anthropic({ apiKey, dangerouslyAllowBrowser: true });
  controller = new AbortController();
  $("output").textContent = "";
  $("review").disabled = true;
  $("stop").hidden = false;
  setStatus("Reviewing…");

  try {
    const stream = client.beta.messages.stream(
      {
        model: "claude-opus-5-5",
        max_tokens: 16000,
        output_config: { effort: "medium" },
        betas: ["server-side-fallback-2026-07-01"],
        fallbacks: "default",
        system: SYSTEM,
        messages: [{ role: "user", content: userText }],
      },
      { signal: controller.signal },
    );
    stream.on("text", (delta) => { $("output").textContent += delta; });
    const message = await stream.finalMessage();
    if (message.stop_reason === "refusal") setStatus("The model declined to review this text.", true);
    else if (message.stop_reason === "max_tokens") setStatus("Feedback was cut off (length limit).", true);
    else setStatus("Done.");
  } catch (err) {
    if (controller.signal.aborted) setStatus("Stopped.");
    else if (err instanceof Anthropic.AuthenticationError) setStatus("Invalid API key.", true);
    else if (err instanceof Anthropic.RateLimitError) setStatus("Rate limited — try again shortly.", true);
    else if (err instanceof Anthropic.APIError) setStatus(`API error ${err.status ?? ""}: ${err.message}`, true);
    else setStatus(`Error: ${err.message}`, true);
  } finally {
    $("review").disabled = false;
    $("stop").hidden = true;
    controller = null;
  }
});
</script>
</body>
</html>
